<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>agentFamily</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    ::-moz-scrollbar-color { #3a3a5a transparent; }
    ::-moz-scrollbar-width { thin; }

    /* 深色主题（默认） */
    :root, [data-theme="dark"] {
      --bg: #1a1a2e; --bg2: #16213e; --bg3: #12122a; --bg4: #2a2a4a;
      --text: #e0e0e0; --text2: #a0a0c0; --border: #2a2a4a; --border2: #3a3a5a;
      --accent: #4a6cf7; --accent-hover: #5a7cf7;
      --user-bg: #4a6cf7; --user-text: #fff;
      --input-bg: #1a1a2e;
    }

    /* 浅色主题 */
    [data-theme="light"] {
      --bg: #f0f2f5; --bg2: #ffffff; --bg3: #f8f9fa; --bg4: #e8eaed;
      --text: #1a1a2e; --text2: #666; --border: #d1d5db; --border2: #c0c4cc;
      --accent: #4a6cf7; --accent-hover: #3a5cf7;
      --user-bg: #4a6cf7; --user-text: #fff;
      --input-bg: #fff;
    }

    body { background: var(--bg); color: var(--text); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3a3a5a; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #5a5a7a; }
    ::-moz-scrollbar-color { #3a3a5a transparent; }
    ::-moz-scrollbar-width { thin; }
    @keyframes dotPulse {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }
    .dot { animation: dotPulse 1.4s infinite; font-size: 8px; margin: 0 2px; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    .code-block { background: var(--bg3); border-radius: 8px; padding: 12px 16px; margin: 8px 0; overflow-x: auto; font-size: 13px; line-height: 1.5; border: 1px solid var(--border2); }
    .code-block code { background: transparent; padding: 0; }
    .inline-code { background: var(--bg4); padding: 1px 5px; border-radius: 3px; font-size: 0.9em; font-family: monospace; }
  </style>
  <script type="module" crossorigin src="./assets/index-CvmGI8pB.js"></script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
